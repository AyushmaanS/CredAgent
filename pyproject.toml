[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "credagent"
version = "0.1.0"
description = "Local CLI agent that obtains and live-verifies developer credentials for an app."
requires-python = ">=3.11"
dependencies = [
  "playwright==1.65.2",  # connects over CDP to the CredAgent-owned Chrome; no browser download needed
  "click>=8.1,<9",
  "httpx>=0.27,<1",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
credagent = "credagent.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["credagent*", "fake_provider*"]

[tool.setuptools.package-data]
fake_provider = ["fixtures/*.json"]
credagent = ["web/static/*", "web/static/js/*", "web/static/js/components/*", "web/static/js/pages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607", "E501"]  # fake secrets and fixed subprocess calls in tests
"src/credagent/browser/observe.py" = ["E501"]  # embedded JavaScript
"fake_provider/**" = ["S105", "S106", "E501"]  # fake site: fake creds, long HTML lines
"scripts/**" = ["S105", "S106", "S310", "S603", "S607", "UP031"]
